# Hopla team moderation (PROTOCOL §23.9, §23.10, REQUIREMENTS TM1–TM12). See docs/MODERATION.md.
#
# Public keys only. NEVER put a private key in this repository.
# The whitelist changes only with an app release, never over the mesh.
#
# k = number of distinct team signatures a TAKEDOWN / RESTORE needs.
k = 1
#
# One line per team member: team_key = <Ed25519 public key, 64 hex chars>.
# The production moderator key arrives in v1.0 (§23.10.8). Until then this line
# stays commented: release builds have no team and ignore every team action
# (TAKEDOWN, RESTORE, GROUP_*, POST/TOPIC/LIVE_TAKEDOWN, ITEM_RESTORE).
# Debug builds may use a DEV/TEST public key from the build environment
# (cargo feature `dev-mod-key`, env OMCP_DEV_MOD_KEY), never set here.
# team_key = <maintainer public key>
