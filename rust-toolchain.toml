# Always track newest stable; keep builds clean so upgrades stay green.
# Targets listed here so rustup installs them with the toolchain (CI adds
# targets via rustup when using channel = "stable").
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
