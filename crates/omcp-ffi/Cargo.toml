[package]
name = "omcp-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI bridge exposing a small safe omcp-core API to Kotlin and Swift (M5 Android, M6 iOS betas, experimental)"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "omcp_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
omcp-core = { path = "../omcp-core" }
uniffi = "=0.28.3"
thiserror = "=2.0.11"
hex = "=0.4.3"
zeroize = "=1.9.1"
getrandom = "=0.2.15"
blake3 = "=1.5.5"
serde = { version = "1", features = ["derive"] }
ciborium = "=0.2.2"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
blake2 = "=0.10.6"

[dev-dependencies]
tempfile = "=3.14.0"
