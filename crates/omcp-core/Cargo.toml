[package]
name = "omcp-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Open Mesh Chat Protocol (OMCP) core — framing, Noise hybrid (M1), BLE loopback (M2), MLS groups + file chunks (M3), gateway + rendezvous (M4), scalable sync (v0.2), encrypted local store"
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Classical Noise building blocks (Noise_IK_25519_ChaChaPoly_BLAKE2b)
blake2 = "=0.10.6"
chacha20poly1305 = "=0.10.1"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }

# PQ KEM (FIPS 203) for suite OMCP-2026-A hybrid
# Requires rustc >= 1.87 (via ctutils); CI uses dtolnay stable.
ml-kem = { version = "=0.3.3", features = ["getrandom"] }

# Hybrid ck mix per PROTOCOL §21.5: HKDF-SHA-384(salt=ck, ikm=mlkem_ss, info=OMCP-Noise-Hybrid-v1)
hkdf = "=0.12.4"
# §20.7 private invites: Elligator2 representatives for ephemeral X25519 keys
# (dirty keys via the Edwards 8-torsion; field math with num-bigint).
curve25519-dalek = "=4.1.3"
num-bigint = "=0.4.8"
# Live video: SFrame (RFC 9605) AES_128_GCM_SHA256_128 media frames.
aes-gcm = "=0.10.3"
sha2 = "=0.10.8"

getrandom = "=0.2.15"
thiserror = "=2.0.11"
zeroize = { version = "=1.9.1", features = ["derive"] }

# M3: BLAKE3 content hashes (PROTOCOL §5.1 / §7)
blake3 = "=1.5.5"

# M3: MLS RFC 9420 (ciphersuite MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519)
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"

# M4: short-lived signed rendezvous tokens (PROTOCOL §9.2). Same crate/version
# OpenMLS already pulls in; default features off (keys built from getrandom bytes).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }

# v0.2 §22.3: optional zstd compression with a static public dictionary.
zstd = { version = "=0.13.3", default-features = false }

# M5: 24-word recovery phrase (BIP39 English wordlist, 256-bit entropy).
bip39 = { version = "=2.1.0", default-features = false, features = ["std"] }

# M5: encrypted cloud backup of the recovery phrase (apps/REQUIREMENTS.md
# "Onboarding & recovery backup"): Argon2id KDF, XChaCha20-Poly1305, CBOR blob.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
ciborium = "=0.2.2"
serde = { version = "1", features = ["derive"] }
zxcvbn = { version = "=3.1.1", default-features = false }

# Encrypted local store (messages, contacts, queue, burn state). Bundled SQLite so
# Android (cargo-ndk) and iOS builds need no system library; every row is sealed
# with XChaCha20-Poly1305 by `store` itself (no SQLCipher / OpenSSL dependency).
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[dev-dependencies]
hex = "=0.4.3"
tempfile = "=3.14.0"
