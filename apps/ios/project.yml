# XcodeGen spec. Generate with: ./scripts/build-rust.sh && xcodegen generate
name: OpenMeshChat
options:
  bundleIdPrefix: chat.omcp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1"
  MARKETING_VERSION: "0.1.30"
  OMCP_GIT_COMMIT: "dev"
  CURRENT_PROJECT_VERSION: 1
  DEVELOPMENT_TEAM: ""
packages:
  HoplaKit:
    path: HoplaKit
  # Live video: libwebrtc build with the frame cryptor (E2EE), BSD-3-Clause, 150.7871.04
  # (same as Android). Local manifest: upstream's needs a newer PackageDescription.
  WebRTCBinary:
    path: Packages/WebRTCBinary
targets:
  # UniFFI Swift bindings (generated, git-ignored) over the Rust static library.
  OmcpFFI:
    type: framework
    platform: iOS
    sources:
      - path: Generated/OmcpFFI
    dependencies:
      - framework: build/OmcpFFI.xcframework
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.omcp.ffi
      GENERATE_INFOPLIST_FILE: true
      BUILD_LIBRARY_FOR_DISTRIBUTION: false
      SKIP_INSTALL: true
  OpenMeshChat:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OpenMeshChat
    dependencies:
      - package: HoplaKit
      - package: WebRTCBinary
        product: WebRTC
      - target: OmcpFFI
      - target: NotificationService
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.omcp.app
      PRODUCT_NAME: OpenMeshChat
      INFOPLIST_FILE: OpenMeshChat/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_ENTITLEMENTS: OpenMeshChat/OpenMeshChat.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Content-free APNs wake-ups (stub; see NotificationService.swift).
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: HoplaKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.omcp.app.notifications
      INFOPLIST_FILE: NotificationService/Info.plist
      GENERATE_INFOPLIST_FILE: false
  OpenMeshChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenMeshChatTests
    dependencies:
      - target: OpenMeshChat
      - package: HoplaKit
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenMeshChat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenMeshChat"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OpenMeshChat:
    build:
      targets:
        OpenMeshChat: all
        OpenMeshChatTests: [test]
    test:
      targets:
        - OpenMeshChatTests
